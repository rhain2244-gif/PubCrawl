<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pub Crawl — Daily Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Karla:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140d0a;
    --bg2:#1e130d;
    --border-blue:#2c5c8f;
    --panel:#0d2340;
    --panel-border:#1d4e8f;
    --panel-border-light:#2c6bb0;
    --red:#c81e3a;
    --red-neon:#ff3b5c;
    --red-glow:rgba(255,59,92,0.55);
    --blue:#2472e8;
    --blue-neon:#5aa9ff;
    --blue-glow:rgba(90,169,255,0.55);
    --blue-dark:#08213f;
    --teal:#22c55e;
    --cream:#f6ead4;
    --tan:#cbb89d;
    --ink:#0d0805;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 30% -10%, rgba(36,114,232,0.18), transparent 55%),
      radial-gradient(ellipse at 78% -5%, rgba(34,197,94,0.12), transparent 55%),
      repeating-linear-gradient(90deg, var(--bg) 0px, var(--bg) 38px, #170f0b 38px, #170f0b 40px);
    color:var(--cream);
    font-family:'Karla', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 12px 60px;
  }
  #app{ width:100%; max-width:640px; }
  .hidden{ display:none !important; }
  h1,h2,h3{ font-family:'Bungee', cursive; font-weight:400; margin:0; }
  button{ font-family:'Karla', sans-serif; cursor:pointer; }

  /* ---------- Neon title ---------- */
  .neon-wrap{ text-align:center; padding:18px 0 6px; }
  .mugs{ font-size:38px; letter-spacing:14px; margin-bottom:6px; filter:drop-shadow(0 0 6px rgba(255,183,3,0.5)); }
  .neon-title{
    font-size:clamp(34px,9vw,58px);
    color:var(--blue-neon);
    text-shadow:
      0 0 6px var(--blue-glow),
      0 0 18px var(--blue-glow),
      0 0 34px rgba(90,169,255,0.35),
      0 0 46px rgba(34,197,94,0.25);
    animation: flicker 4.5s infinite;
    letter-spacing:2px;
  }
  @keyframes flicker{
    0%,18%,22%,25%,53%,57%,100%{ opacity:1; }
    20%,24%,55%{ opacity:0.55; }
  }
  .tagline{ color:var(--tan); font-size:14px; letter-spacing:3px; text-transform:uppercase; margin-top:4px; }
  .day-badge{
    display:inline-block; margin-top:14px; background:var(--blue-neon); color:var(--blue-dark);
    font-family:'Space Mono',monospace; font-weight:700; font-size:13px;
    padding:4px 14px; border-radius:3px; transform:rotate(-2deg);
    box-shadow:0 2px 0 rgba(0,0,0,0.35);
  }

  /* ---------- Chalkboard lineup ---------- */
  .chalkboard{
    background:var(--panel); border:6px solid var(--panel-border); border-radius:8px;
    margin:22px 0; padding:16px 18px;
  }
  .chalkboard .label{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--tan); margin-bottom:8px; }
  .chalk-icons{ font-size:26px; letter-spacing:10px; }
  .rules{ font-size:14px; line-height:1.7; color:var(--tan); margin-top:12px; }
  .rules b{ color:var(--cream); }
  .otd-loading{ font-size:13px; color:var(--tan); font-style:italic; }
  .otd-item{ font-size:14px; color:var(--tan); line-height:1.6; margin-bottom:6px; }
  .otd-item b{ color:var(--blue-neon); font-family:'Space Mono',monospace; }
  .lineup-row{ display:flex; justify-content:space-between; font-size:14px; padding:6px 2px; border-bottom:1px dashed var(--border-blue); }
  .lineup-row span:first-child{ color:var(--tan); }
  .lineup-row span:last-child{ color:var(--cream); font-weight:700; }
  .cat-banner{ text-align:center; font-family:'Bungee'; font-size:20px; color:var(--cream); margin:4px 0 14px; }
  .cat-banner .ic{ font-size:30px; display:block; margin-bottom:4px; }
  .theme-sub{ text-align:center; font-size:12px; color:var(--tan); letter-spacing:1px; text-transform:uppercase; margin:-10px 0 14px; font-style:italic; }

  /* ---------- Buttons ---------- */
  .btn-tap{
    display:block; width:100%; text-align:center; border:none; border-radius:6px;
    background:var(--blue); color:var(--cream); font-family:'Bungee'; font-size:18px;
    padding:16px; margin-top:18px; box-shadow:0 4px 0 #123f85, 0 0 20px rgba(36,114,232,0.35);
  }
  .btn-tap:active{ transform:translateY(3px); box-shadow:0 1px 0 #123f85; }
  .btn-secondary{
    border:2px solid var(--border-blue); background:transparent; color:var(--cream);
    border-radius:6px; padding:10px 14px; font-size:14px; font-weight:700;
  }
  .btn-secondary:hover{ border-color:var(--blue-neon); color:var(--blue-neon); }
  .btn-row{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }

  /* ---------- Round header ---------- */
  .round-header{ text-align:center; margin:6px 0 16px; }
  .round-header .plank{
    display:inline-block; background:var(--blue-neon); border-bottom:3px solid var(--blue);
    padding:8px 22px; border-radius:4px; font-family:'Bungee'; font-size:15px;
    letter-spacing:1px; color:var(--blue-dark);
  }
  .score-strip{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Space Mono',monospace; font-size:13px; color:var(--tan); margin:10px 2px 4px;
  }
  .score-strip .val{ color:var(--blue-neon); font-weight:700; }

  /* ---------- Board grid ---------- */
  .board{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  /* ---------- Question ticket ---------- */
  .ticket{
    background:var(--panel); border:2px dashed var(--panel-border-light); border-radius:8px;
    padding:20px; margin-top:16px;
  }
  .ticket .pts-tag{
    display:inline-block; background:var(--blue-neon); color:var(--blue-dark); font-family:'Space Mono';
    font-weight:700; font-size:13px; padding:2px 10px; border-radius:3px; margin-bottom:10px;
  }
  .ticket .qtext{ font-size:17px; line-height:1.5; margin-bottom:16px; }
  .confidence-label{ font-size:13px; color:var(--tan); margin-bottom:8px; }
  .whoami-note{ text-align:center; font-size:12px; color:var(--tan); font-style:italic; margin-bottom:8px; }
  .whoami-timer{ text-align:center; font-family:'Space Mono',monospace; font-size:17px; color:var(--blue-neon); font-weight:700; margin-bottom:8px; }
  .whoami-subject{ text-align:center; font-size:12px; color:var(--tan); text-transform:uppercase; letter-spacing:2px; margin-bottom:10px; }
  .value-row{ display:flex; gap:8px; }
  .value-btn{
    flex:1; padding:12px; border:2px solid var(--border-blue); background:var(--bg);
    color:var(--cream); border-radius:6px; font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
  }
  .value-btn:hover{ border-color:var(--blue-neon); }
  .value-btn.selected{ border-color:var(--blue-neon); background:var(--blue-dark); color:var(--blue-neon); }
  .opt-btn{
    display:block; width:100%; text-align:left; background:var(--bg); border:2px solid var(--border-blue);
    color:var(--cream); border-radius:6px; padding:12px 14px; margin-bottom:8px; font-size:15px;
  }
  .opt-btn:hover{ border-color:var(--blue-neon); }
  .opt-btn.correct{ border-color:var(--teal); background:#0f2e29; color:var(--teal); }
  .opt-btn.wrong{ border-color:var(--red); background:#2e0f16; color:var(--red-neon); }
  .opt-btn:disabled{ cursor:default; }
  .num-row{ display:flex; gap:10px; align-items:center; }
  .num-row input{
    flex:1; background:var(--bg); border:2px solid var(--border-blue); color:var(--cream);
    font-family:'Space Mono'; font-size:16px; padding:10px 12px; border-radius:6px;
  }
  .result-box{ margin-top:14px; padding:12px 14px; border-radius:6px; font-size:14px; line-height:1.6; }
  .result-box.right{ background:#0f2e29; border:1px solid var(--teal); color:var(--cream); }
  .result-box.wrong{ background:#2e0f16; border:1px solid var(--red); color:var(--cream); }
  .finale-breakdown{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border-blue); }
  .breakdown-line{ font-size:12px; color:var(--tan); line-height:1.6; margin-bottom:5px; }
  .fact{ color:var(--tan); margin-top:6px; }
  .err{ color:var(--red-neon); font-size:13px; margin-top:6px; }

  /* ---------- Finale ---------- */
  .finale-badge{
    text-align:center; font-family:'Bungee'; color:var(--blue-neon); font-size:15px;
    letter-spacing:2px; text-transform:uppercase; margin-bottom:6px;
  }
  .wager-total{ text-align:center; font-family:'Space Mono'; font-size:15px; color:var(--tan); margin-bottom:14px; }
  .wager-total b{ color:var(--blue-neon); font-size:20px; }
  .wager-row{ display:flex; gap:10px; align-items:center; margin:14px 0; }
  .wager-row input[type=number]{
    flex:1; background:var(--bg); border:2px solid var(--border-blue); color:var(--cream);
    font-family:'Space Mono'; font-size:18px; padding:10px; border-radius:6px; text-align:center;
  }
  .finale-inputs{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .finale-input{
    background:var(--bg); border:2px solid var(--border-blue); color:var(--cream);
    font-family:'Karla',sans-serif; font-size:15px; padding:10px 12px; border-radius:6px;
  }
  .finale-input.correct{ border-color:var(--teal); background:#0f2e29; color:var(--teal); }
  .finale-input.wrong{ border-color:var(--red); background:#2e0f16; color:var(--red-neon); }
  .bonus-followup{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border-blue); }
  .art-image-wrap{ text-align:center; margin-bottom:14px; }
  .art-image{ max-width:100%; max-height:320px; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,0.5); }
  .order-slots{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .order-slot{ background:var(--bg); border:2px dashed var(--border-blue); border-radius:6px; padding:10px 12px; font-size:14px; color:var(--tan); cursor:pointer; min-height:20px; }
  .order-slot.filled{ color:var(--cream); border-style:solid; }
  .order-slot.correct{ border-color:var(--teal); background:#0f2e29; color:var(--teal); }
  .order-slot.wrong{ border-color:var(--red); background:#2e0f16; color:var(--red-neon); }
  .order-pool{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .order-item{ background:var(--bg); border:2px solid var(--border-blue); border-radius:6px; padding:10px 12px; font-size:14px; color:var(--cream); text-align:left; }
  .order-item:hover{ border-color:var(--blue-neon); }
  .order-item:disabled{ opacity:0.35; cursor:default; }
  .quick-bets{ display:flex; gap:8px; margin-bottom:6px; }
  .quick-bets button{ flex:1; }

  /* ---------- Receipt / tab ---------- */
  .receipt{
    background:#faf6ec; color:#241611; font-family:'Space Mono', monospace; font-size:13px;
    padding:20px 22px 26px; border-radius:2px; line-height:1.8;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    background-image: repeating-linear-gradient(-90deg, transparent, transparent 9px, rgba(0,0,0,0.04) 9px, rgba(0,0,0,0.04) 10px);
    -webkit-mask-image: linear-gradient(#000 96%, transparent 100%),
      repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 12px);
  }
  .receipt-head{ text-align:center; font-family:'Bungee'; font-size:18px; color:#1d5fc2; margin-bottom:2px; }
  .receipt-sub{ text-align:center; font-size:11px; letter-spacing:2px; margin-bottom:14px; }
  .receipt-line{ display:flex; justify-content:space-between; border-bottom:1px dashed #b7ac97; padding:4px 0; }
  .receipt-total{ display:flex; justify-content:space-between; font-weight:700; font-size:16px; margin-top:10px; padding-top:8px; border-top:2px solid #241611; }
  .receipt-tag{ text-align:center; margin-top:14px; font-size:12px; font-style:italic; }
  .receipt-shoutout{ text-align:center; margin-top:12px; padding-top:10px; border-top:1px dashed #b7ac97; font-size:11px; line-height:1.6; color:#5a5040; }
  .copy-flash{ text-align:center; font-size:13px; color:var(--teal); margin-top:8px; height:16px; }
  .qa-recap{ margin-top:18px; }
  .qa-recap-title{ font-family:'Bungee'; font-size:14px; color:var(--blue-neon); text-align:center; margin-bottom:10px; letter-spacing:1px; text-transform:uppercase; }
  .qa-recap-item{ background:var(--panel); border:1px solid var(--panel-border-light); border-radius:6px; padding:10px 12px; margin-bottom:8px; }
  .qa-recap-item.wrong{ border-color:var(--red); }
  .qa-recap-item.right{ border-color:var(--teal); }
  .qa-recap-q{ font-size:13px; color:var(--cream); line-height:1.5; margin-bottom:4px; }
  .qa-recap-cat{ color:var(--tan); font-style:italic; }
  .qa-recap-a{ font-size:12px; color:var(--tan); line-height:1.5; }
  textarea#share-fallback{
    width:100%; margin-top:10px; background:var(--bg2); color:var(--tan); border:1px solid var(--border-blue);
    border-radius:6px; padding:10px; font-family:'Space Mono'; font-size:12px;
  }
</style>
</head>

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rng){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(rng()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function findForcedDay(){
  for(var i=0;i<FORCED_DAYS.length;i++){
    var f = FORCED_DAYS[i];
    if(today.getFullYear()===f.year && (today.getMonth()+1)===f.month && today.getDate()===f.day) return f;
  }
  return null;
}
var forcedDay = findForcedDay();

function buildRoundContent(key, tier){
  var cat = CATEGORIES[key];
  var ed = catData(key);
  return { icon:cat.icon, name:cat.name, theme:ed[tier].theme, questions:ed[tier].questions };
}
function buildFinaleContent(key){
  var cat = CATEGORIES[key];
  var f = catData(key).finale;
  return { icon:cat.icon, name:cat.name, topic:f.topic, prompt:f.prompt, need:f.need, total:f.total, answers:f.answers, fact:f.fact };
}

if(forcedDay && forcedDay.content){

} else {

    round1: shuffledCats[0], round2: shuffledCats[1], round3: shuffledCats[2], finale: shuffledCats[3]
  };
  todaysContent = {
    round1: buildRoundContent(todaysLineup.round1, "tierA"),
    round2: buildRoundContent(todaysLineup.round2, "tierA"),
    round3: buildRoundContent(todaysLineup.round3, "tierB"),
    finale: buildFinaleContent(todaysLineup.finale)
  };
}

};

function baseScore(){
  var s=0;
  state.rounds.forEach(function(r){
    Object.keys(r.answered).forEach(function(k){
      var a=r.answered[k];
      if(a.correct) s+=a.pts;
      s += a.bonusPtsEarned || 0;
    });
  });
  return s;
}
function totalScore(){
  var s = baseScore();
  if(state.finale.answered){
    s += state.finale.pts;
  }
  return s;
}
function roundComplete(idx){
  return Object.keys(state.rounds[idx].answered).length >= 3;
}

function loadOnThisDay(){
  var el = document.getElementById("onThisDay");
  if(!el) return;
  if(typeof fetch !== "function"){
    var box0 = document.getElementById("onThisDayBox");
    if(box0) box0.style.display = "none";
    return;
  }
  var mm = String(today.getMonth()+1).padStart(2,"0");
  var dd = String(today.getDate()).padStart(2,"0");
  var url = "https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/"+mm+"/"+dd;
  fetch(url).then(function(res){
    if(!res.ok) throw new Error("bad response");
    return res.json();
  }).then(function(data){
    var events = (data.events||[]).filter(function(e){ return e.year && e.text; });
    if(events.length===0) throw new Error("no events");
    var picks = [];
    if(events.length>=2){
      picks.push(events[Math.floor(events.length*0.25)]);
      picks.push(events[Math.floor(events.length*0.7)]);
    } else {
      picks.push(events[0]);
    }
    var html = picks.map(function(e){
      return '<div class="otd-item"><b>'+e.year+'</b> — '+e.text+'</div>';
    }).join("");
    var box = document.getElementById("onThisDay");
    if(box){ box.classList.remove("otd-loading"); box.innerHTML = html; }
  }).catch(function(){
    var box = document.getElementById("onThisDayBox");
    if(box) box.style.display = "none";
  });
}

var questionLog = [];

function stripHTML(s){
  return String(s).replace(/<[^>]*>/g, "").trim();
}

function logQuestion(categoryLabel, questionText, yourAnswer, correctAnswer, correct){
  questionLog.push({
    category: categoryLabel,
    question: stripHTML(questionText),
    yourAnswer: yourAnswer,
    correctAnswer: correctAnswer,
    correct: correct
  });
}

function startGame(){
  questionLog = [];
  openQuestion(0,0);
}

function openQuestion(roundIdx, qIndex){
  clearInterval(whoAmITimer);
  var rd = todaysContent["round"+(roundIdx+1)];
  var q = rd.questions[qIndex];
  state.roundIdx = roundIdx;
  state.current = {roundIdx:roundIdx, qIndex:qIndex, q:q, isFinale:false};

  render();
}

function questionBodyHTML(q, gated){
  var dis = gated ? " disabled" : "";
  if(q.type==="mc"){
    var opts = q.options.map(function(opt,i){
      return '<button class="opt-btn" id="opt'+i+'" onclick="submitMC('+i+')" disabled>'+opt+'</button>';

        '<div class="confidence-label" style="margin-top:0;">Know it outright? Type your answer for <b>double points</b> — or play it safe with multiple choice.</div>'+
        '<div class="num-row"><input type="text" id="bonusInput" placeholder="Type your answer"'+dis+'><button class="btn-secondary" id="bonusSubmitBtn" onclick="submitBonus()"'+dis+'>Submit for bonus</button></div>'+
        '<div id="bonusErr" class="err"></div>'+
        '<button class="btn-secondary" id="skipToMCBtn" style="margin-top:8px; width:100%;" onclick="revealMCOptions()"'+dis+'>Show multiple choice instead</button>'+
      '</div>'+
      '<div id="mcOptions" class="hidden">'+opts+'</div>'+
      '<div id="qresult"></div>';
  }
  if(q.type==="text"){
    return '<div class="num-row"><input type="text" id="textAns" placeholder="Your answer"'+dis+'><button class="btn-secondary" id="textSubmitBtn" onclick="submitText()"'+dis+'>Submit answer</button></div>'+

  return '<div class="num-row"><input type="number" id="numAns" placeholder="Your guess"'+dis+'><button class="btn-secondary" id="numSubmitBtn" onclick="submitNum()"'+dis+'>Submit guess</button></div>'+
    '<div id="numErr" class="err"></div><div id="qresult"></div>';

function renderQuestion(){
  var cur = state.current;
  var q = cur.q;
  var def = ROUND_DEFS[cur.roundIdx];
  var rd = todaysContent["round"+(cur.roundIdx+1)];
  if(rd.whoAmI){ return renderWhoAmI(rd, cur); }
  var r = state.rounds[cur.roundIdx];
  var used = Object.keys(r.answered).map(function(k){ return r.answered[k].value; });
  var remaining = def.points.filter(function(v){ return used.indexOf(v)===-1; });
  var valueButtons = remaining.map(function(v){
    return '<button class="value-btn" id="val'+v+'" onclick="chooseValue('+v+')">'+v+' pts</button>';
  }).join("");

    (rd.theme ? '<div class="theme-sub">'+rd.theme+'</div>' : '')+

    '<div class="ticket">'+
      '<div class="confidence-label">How many points do you want to put on this one?</div>'+
      '<div class="value-row">'+valueButtons+'</div>'+
      '<div id="valueErr" class="err"></div>'+

    '</div>';
}

var whoAmITimer = null;
var whoAmIState = null;

function renderWhoAmI(rd, cur){
  var q = rd.questions[cur.qIndex];
  var spc = rd.secondsPerClue || 15;
  var label = rd.promptLabel || "Who am I?";
  whoAmIState = { stage:0, stageRemaining:spc, secondsPerClue:spc, label:label, answered:false };
  app.innerHTML =
    '<div class="round-header"><span class="plank">'+ROUND_DEFS[cur.roundIdx].label+' · '+label+' '+(cur.qIndex+1)+' of 3</span></div>'+
    '<div class="cat-banner"><span class="ic">'+rd.icon+'</span>'+rd.name+'</div>'+
    (rd.theme ? '<div class="theme-sub">'+rd.theme+'</div>' : '')+
    '<div class="score-strip"><span>Your tab so far</span><span class="val">'+baseScore()+' pts</span></div>'+
    '<div class="ticket">'+
      '<div class="whoami-note">⏳ Each clue gets its own fresh '+spc+' seconds — '+(spc*3)+' seconds total across all three.</div>'+
      '<div class="whoami-timer" id="whoamiTimer">⏱ '+spc+'s left on this clue — worth '+q.clues[0].pts+' pts</div>'+
      '<div class="whoami-subject">'+q.subject+'</div>'+
      '<div class="qtext" id="whoamiClue">'+q.clues[0].text+'</div>'+
      '<div class="num-row"><input type="text" id="whoamiInput" placeholder="'+label+'"><button class="btn-secondary" id="whoamiSubmitBtn" onclick="submitWhoAmI()">Guess</button></div>'+
      '<div id="whoamiErr" class="err"></div>'+
      '<div id="qresult"></div>'+
    '</div>';
  startWhoAmITimer(q);
}

function startWhoAmITimer(q){
  clearInterval(whoAmITimer);
  whoAmITimer = setInterval(function(){ tickWhoAmI(q); }, 1000);
}

function tickWhoAmI(q){
  if(!whoAmIState || whoAmIState.answered){ clearInterval(whoAmITimer); return; }
  whoAmIState.stageRemaining--;
  if(whoAmIState.stageRemaining <= 0){
    if(whoAmIState.stage < 2){
      whoAmIState.stage++;
      whoAmIState.stageRemaining = whoAmIState.secondsPerClue;
      var clueEl = document.getElementById("whoamiClue");
      if(clueEl) clueEl.textContent = q.clues[whoAmIState.stage].text;
    } else {
      clearInterval(whoAmITimer);
      timeUpWhoAmI(q);
      return;
    }
  }
  var timerEl = document.getElementById("whoamiTimer");
  if(timerEl){
    timerEl.textContent = "⏱ "+whoAmIState.stageRemaining+"s left on this clue — worth "+q.clues[whoAmIState.stage].pts+" pts";
  }
}

function timeUpWhoAmI(q){
  if(!whoAmIState || whoAmIState.answered) return;
  whoAmIState.answered = true;
  var inp = document.getElementById("whoamiInput");
  if(inp) inp.disabled = true;
  var btn = document.getElementById("whoamiSubmitBtn");
  if(btn) btn.disabled = true;
  pendingValue = null;
  recordAnswer(false, 0);
  var rd = todaysContent["round"+(state.current.roundIdx+1)];
  logQuestion(rd.name, whoAmIState.label+" ("+q.subject+")", "(time ran out)", q.answers[0], false);
  document.getElementById("qresult").innerHTML =
    '<div class="result-box wrong">Time\'s up! It was <b>'+q.answers[0]+'</b>.<div class="fact">'+q.fact+'</div></div>'+
    '<button class="btn-secondary" style="margin-top:12px;" onclick="afterQuestion()">Continue</button>';
}

function submitWhoAmI(){
  if(!whoAmIState || whoAmIState.answered) return;
  var rd = todaysContent["round"+(state.current.roundIdx+1)];
  var q = rd.questions[state.current.qIndex];
  var val = document.getElementById("whoamiInput").value.trim();
  if(val===""){
    document.getElementById("whoamiErr").textContent = "Type a guess first.";
    return;
  }
  document.getElementById("whoamiErr").textContent = "";
  var correct = matchesGroup(val, q.answers);
  whoAmIState.answered = true;
  clearInterval(whoAmITimer);
  document.getElementById("whoamiInput").disabled = true;
  document.getElementById("whoamiSubmitBtn").disabled = true;
  var pts = correct ? q.clues[whoAmIState.stage].pts : 0;
  pendingValue = null;
  recordAnswer(correct, pts);
  logQuestion(rd.name, whoAmIState.label+" ("+q.subject+")", val, q.answers[0], correct);
  var note = correct
    ? ("+"+pts+" pts banked — guessed with "+whoAmIState.stageRemaining+"s left on that clue.")
    : "No points on this one.";
  document.getElementById("qresult").innerHTML = factHTML(correct, q.answers[0], q.fact, note);
}

function chooseValue(v){
  pendingValue = v;
  var vb = document.getElementsByClassName("value-btn");
  for(var i=0;i<vb.length;i++){ vb[i].classList.remove("selected"); }
  var chosen = document.getElementById("val"+v);
  if(chosen) chosen.classList.add("selected");
  document.getElementById("valueErr").textContent = "";
  var numAns = document.getElementById("numAns");
  if(numAns){
    numAns.disabled = false;
    document.getElementById("numSubmitBtn").disabled = false;
  }
  var bonusInput = document.getElementById("bonusInput");
  if(bonusInput){
    bonusInput.disabled = false;
    document.getElementById("bonusSubmitBtn").disabled = false;
    document.getElementById("skipToMCBtn").disabled = false;
  }
  var textAns = document.getElementById("textAns");
  if(textAns){
    textAns.disabled = false;
    document.getElementById("textSubmitBtn").disabled = false;
  }
}

function revealMCOptions(){
  document.getElementById("bonusArea").classList.add("hidden");
  document.getElementById("mcOptions").classList.remove("hidden");
  var opts = document.getElementsByClassName("opt-btn");
  for(var i=0;i<opts.length;i++){ opts[i].disabled = false; }
}

function submitBonus(){
  var cur = state.current, q = cur.q;
  if(pendingValue===null){
    document.getElementById("valueErr").textContent = "Choose a point value first.";
    return;
  }
  var val = document.getElementById("bonusInput").value.trim();
  if(val===""){
    document.getElementById("bonusErr").textContent = "Type a guess, or tap \"Show multiple choice instead.\"";
    return;
  }
  document.getElementById("bonusErr").textContent = "";
  var correctText = q.options[q.answer];
  var isCorrect = matchesGroup(val, [correctText]);
  document.getElementById("bonusInput").disabled = true;
  document.getElementById("bonusSubmitBtn").disabled = true;
  document.getElementById("skipToMCBtn").disabled = true;
  var bonusPts = isCorrect ? pendingValue*2 : 0;
  recordAnswer(isCorrect, bonusPts, true);
  var rd = todaysContent["round"+(cur.roundIdx+1)];
  logQuestion(rd.name, q.q, val, correctText, isCorrect);
  var note = isCorrect
    ? ("Nailed it cold — +"+bonusPts+" pts banked (double!).")
    : ("No bonus this time — you had "+pendingValue+" pts on this one, and skipping to multiple choice would've still given you a shot at it. No points earned.");
  document.getElementById("qresult").innerHTML = factHTML(isCorrect, correctText, q.fact, note);
}

function factHTML(correct, correctText, fact, ptsNote){
  var cls = correct ? "right" : "wrong";
  var head = correct ? "Correct! 🍻" : ("Not quite — it was "+correctText+".");
  var noteLine = ptsNote ? ('<div style="margin-top:4px; font-weight:700;">'+ptsNote+'</div>') : "";
  return '<div class="result-box '+cls+'">'+head+noteLine+'<div class="fact">'+fact+'</div></div>'+
    '<button class="btn-secondary" style="margin-top:12px;" onclick="afterQuestion()">Continue</button>';
}

function submitMC(i){
  var cur = state.current, q=cur.q;
  if(pendingValue===null){
    document.getElementById("valueErr").textContent = "Choose a point value first.";
    return;
  }
  var correct = (i===q.answer);
  for(var k=0;k<q.options.length;k++){
    var el = document.getElementById("opt"+k);
    el.disabled = true;
    if(k===q.answer) el.classList.add("correct");
    else if(k===i) el.classList.add("wrong");
  }
  recordAnswer(correct);
  var rd1 = todaysContent["round"+(cur.roundIdx+1)];
  logQuestion(rd1.name, q.q, q.options[i], q.options[q.answer], correct);
  var note = correct ? ("+"+pendingValue+" pts banked.") : ("You had "+pendingValue+" pts on this one — no points earned.");
  document.getElementById("qresult").innerHTML = factHTML(correct, q.options[q.answer], q.fact, note);
}

    document.getElementById("valueErr").textContent = "Choose a point value first.";

  document.getElementById("qresult").innerHTML = factHTML(correct, String(q.answer), q.fact, note);
}

      '<div class="bonus-followup">'+
        '<div class="confidence-label">'+q.bonus.q+' (+'+q.bonus.pts+' bonus pts)</div>'+
        '<div class="num-row"><input type="text" id="bonusFollowupInput" placeholder="Your answer"><button class="btn-secondary" id="bonusFollowupBtn" onclick="submitBonusFollowup()">Submit</button></div>'+
        '<button class="btn-secondary" id="bonusSkipBtn" style="margin-top:8px;width:100%;" onclick="skipBonusFollowup()">Skip bonus</button>'+
        '<div id="bonusFollowupResult"></div>'+
      '</div>';
  } else {
    document.getElementById("qresult").innerHTML = factHTML(correct, q.answers[0], q.fact, note);
  }
}

function submitBonusFollowup(){
  var cur = state.current, q = cur.q;
  var val = document.getElementById("bonusFollowupInput").value.trim();
  if(val===""){ return; }
  var correct = matchesGroup(val, q.bonus.answers);
  document.getElementById("bonusFollowupInput").disabled = true;
  document.getElementById("bonusFollowupBtn").disabled = true;
  document.getElementById("bonusSkipBtn").disabled = true;
  if(correct){
    var r = state.rounds[cur.roundIdx];
    r.answered[cur.qIndex].bonusPtsEarned = q.bonus.pts;
  }
  var rd = todaysContent["round"+(cur.roundIdx+1)];
  logQuestion(rd.name, q.bonus.q, val, q.bonus.answers[0], correct);
  document.getElementById("bonusFollowupResult").innerHTML =
    '<div class="result-box '+(correct?"right":"wrong")+'" style="margin-top:8px;">'+(correct ? ("Bonus! +"+q.bonus.pts+" pts.") : ("Bonus missed — it was "+q.bonus.answers[0]+"."))+'</div>'+
    '<button class="btn-secondary" style="margin-top:12px;" onclick="afterQuestion()">Continue</button>';
}

function skipBonusFollowup(){
  document.getElementById("bonusFollowupInput").disabled = true;
  document.getElementById("bonusFollowupBtn").disabled = true;
  document.getElementById("bonusSkipBtn").disabled = true;
  document.getElementById("bonusFollowupResult").innerHTML =
    '<button class="btn-secondary" style="margin-top:12px;" onclick="afterQuestion()">Continue</button>';
}

function recordAnswer(correct, customPts, viaBonus){
  var cur = state.current;
  var r = state.rounds[cur.roundIdx];
  var pts = (customPts !== undefined && customPts !== null) ? customPts : pendingValue;
  r.answered[cur.qIndex] = {value:pendingValue, correct:correct, pts:pts, viaBonus: !!viaBonus};
}

function afterQuestion(){
  var cur = state.current;
  var idx = cur.roundIdx;
  if(roundComplete(idx)){
    state.screen="roundEnd";
    render();
    return;
  }
  var r = state.rounds[idx];
  var nextQ = -1;
  for(var i=0;i<3;i++){ if(!r.answered.hasOwnProperty(i)){ nextQ=i; break; } }
  openQuestion(idx, nextQ);
}

function renderRoundEnd(){
  var def = ROUND_DEFS[state.roundIdx];
  var isLastRound = state.roundIdx===2;
  var nextLabel = isLastRound ? "Head to Last Call →" : ("Continue to "+ROUND_DEFS[state.roundIdx+1].label+" →");
  app.innerHTML =
    '<div class="round-header"><span class="plank">'+def.label+' complete</span></div>'+
    '<div class="chalkboard" style="text-align:center;">'+
      '<div class="label">Running tab</div>'+
      '<div style="font-family:\'Space Mono\'; font-size:32px; color:var(--blue-neon);">'+baseScore()+' pts</div>'+
    '</div>'+
    '<button class="btn-tap" onclick="advanceAfterRound()">'+nextLabel+'</button>';
}

function advanceAfterRound(){
  if(state.roundIdx<2){
    openQuestion(state.roundIdx+1, 0);
  } else {
    state.screen="finaleIntro";
    render();
  }
}

function renderFinaleIntro(){
  var q = todaysContent.finale;
  var total = baseScore();
  var explainer = q.type==="order"
    ? ("You\'ll need to put <b>"+q.need+"</b> events in the right order. Each one in its correct spot is worth <b>5 pts</b> — get all "+q.need+" right and bank a <b>5 pt bonus</b> on top.")
    : ("You\'ll need to name <b>"+q.need+"</b> correct answers. Each correct one is worth <b>5 pts</b> — get all "+q.need+" right and bank a <b>5 pt bonus</b> on top.");
  app.innerHTML =
    '<div class="finale-badge">🔔 Last Call</div>'+
    '<div class="wager-total">Tonight\'s category is<br><span style="font-family:\'Bungee\'; font-size:26px; color:var(--cream);">'+q.icon+' '+q.name+'</span></div>'+
    '<div class="wager-total">Topic: <b>'+q.topic+'</b></div>'+
    '<div class="wager-total" style="color:var(--tan); font-size:13px;">'+explainer+'</div>'+
    '<div class="wager-total" style="font-size:13px;">Your tab so far: <b>'+total+' pts</b></div>'+
    '<button class="btn-tap" onclick="startFinaleQuestion()">Start Last Call 🔔</button>';
}

function startFinaleQuestion(){
  state.screen="finaleQuestion";
  render();
}

function renderFinaleQuestion(){
  var q = todaysContent.finale;
  state.current = {q:q, isFinale:true};
  if(q.type==="order"){ return renderOrderFinale(q); }
  var inputs = "";
  for(var i=0;i<q.need;i++){
    inputs += '<input type="text" class="finale-input" id="finaleInput'+i+'" placeholder="Answer '+(i+1)+'">';
  }
  app.innerHTML =
    '<div class="finale-badge">🔔 Last Call</div>'+
    '<div class="ticket">'+
      '<div class="pts-tag">'+q.icon+' '+q.name+' · '+q.topic+'</div>'+
      '<div class="qtext">'+q.prompt+'</div>'+
      '<div class="whoami-note">💡 Don\'t sweat exact spelling — close guesses count.</div>'+
      '<div class="finale-inputs">'+inputs+'</div>'+
      '<div id="finaleErr" class="err"></div>'+
      '<button class="btn-tap" id="finaleSubmitBtn" onclick="submitFinale()">Lock in answers 🔒</button>'+
      '<div id="qresult"></div>'+
    '</div>';
}

var orderState = null;

function renderOrderFinale(q){
  var slotsHTML = "";
  for(var i=0;i<q.items.length;i++){
    slotsHTML += '<div class="order-slot" id="slot'+i+'" onclick="unplaceSlot('+i+')">'+(i+1)+'.</div>';
  }
  var poolHTML = q.items.map(function(item,idx){
    return '<button class="order-item" id="item'+idx+'" onclick="placeItem('+idx+')">'+item.text+'</button>';
  }).join("");
  app.innerHTML =
    '<div class="finale-badge">🔔 Last Call</div>'+
    '<div class="ticket">'+
      '<div class="pts-tag">'+q.icon+' '+q.name+' · '+q.topic+'</div>'+
      '<div class="qtext">'+q.prompt+'</div>'+
      '<div class="confidence-label">Tap events below to fill in the slots, oldest first. Tap a filled slot to undo.</div>'+
      '<div class="order-slots" id="orderSlots">'+slotsHTML+'</div>'+
      '<div class="order-pool" id="orderPool">'+poolHTML+'</div>'+
      '<div id="finaleErr" class="err"></div>'+
      '<button class="btn-tap" id="finaleSubmitBtn" onclick="submitOrderFinale()" disabled>Lock in order 🔒</button>'+
      '<div id="qresult"></div>'+
    '</div>';
  orderState = { placed: new Array(q.items.length).fill(null) };
}

function placeItem(itemIdx){
  if(!orderState) return;
  var el = document.getElementById("item"+itemIdx);
  if(el.disabled) return;
  var nextSlot = orderState.placed.indexOf(null);
  if(nextSlot === -1) return;
  orderState.placed[nextSlot] = itemIdx;
  el.disabled = true;
  el.classList.add("placed-item");
  var q = todaysContent.finale;
  var slotEl = document.getElementById("slot"+nextSlot);
  slotEl.textContent = (nextSlot+1)+". "+q.items[itemIdx].text;
  slotEl.classList.add("filled");
  if(orderState.placed.indexOf(null) === -1){
    document.getElementById("finaleSubmitBtn").disabled = false;
  }
}

function unplaceSlot(slotIdx){
  if(!orderState) return;
  var itemIdx = orderState.placed[slotIdx];
  if(itemIdx === null) return;
  orderState.placed[slotIdx] = null;
  var itemEl = document.getElementById("item"+itemIdx);
  itemEl.disabled = false;
  itemEl.classList.remove("placed-item");
  var slotEl = document.getElementById("slot"+slotIdx);
  slotEl.textContent = (slotIdx+1)+".";
  slotEl.classList.remove("filled");
  document.getElementById("finaleSubmitBtn").disabled = true;
}

function submitOrderFinale(){
  var q = todaysContent.finale;
  var correctCount = 0;
  for(var i=0;i<orderState.placed.length;i++){
    var itemIdx = orderState.placed[i];
    var item = q.items[itemIdx];
    var isRight = (item.correctRank === i+1);
    if(isRight) correctCount++;
    var slotEl = document.getElementById("slot"+i);
    slotEl.classList.add(isRight ? "correct" : "wrong");
  }
  var allCorrect = (correctCount === q.items.length);
  var earnedPts = correctCount*5 + (allCorrect ? 5 : 0);
  state.finale.answered = true;
  state.finale.correctCount = correctCount;
  state.finale.correct = allCorrect;
  state.finale.pts = earnedPts;
  document.getElementById("finaleSubmitBtn").disabled = true;
  for(var s=0;s<orderState.placed.length;s++){
    var placedIdx = orderState.placed[s];
    var placedItem = q.items[placedIdx];
    var isRight2 = (placedItem.correctRank === s+1);
    logQuestion("Finale — "+q.name, "Order slot #"+(s+1), placedItem.text, isRight2 ? placedItem.text : "wrong slot", isRight2);
  }
  var correctOrder = q.items.slice().sort(function(a,b){ return a.correctRank - b.correctRank; })
    .map(function(it,i){ return (i+1)+". "+it.text; }).join(" ");
  var head = allCorrect
    ? ("Perfect order! +"+earnedPts+" pts (including the 5 pt perfect bonus) 🍻")
    : (correctCount+" of "+q.items.length+" in the right spot — +"+earnedPts+" pts banked.");
  document.getElementById("qresult").innerHTML =
    '<div class="result-box '+(allCorrect?"right":(correctCount>0?"right":"wrong"))+'">'+head+
      '<div class="fact">Correct order: '+correctOrder+' '+q.fact+'</div>'+
    '</div>'+
    '<button class="btn-secondary" style="margin-top:12px;" onclick="goToEnd()">See my tab</button>';
}

function normalizeGuess(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9 ]/g,"");
}

function levenshtein(a, b){
  var m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  var prev = new Array(n+1);
  var curr = new Array(n+1);
  for(var j=0;j<=n;j++) prev[j] = j;
  for(var i=1;i<=m;i++){
    curr[0] = i;
    for(var j=1;j<=n;j++){
      var cost = (a.charAt(i-1)===b.charAt(j-1)) ? 0 : 1;
      curr[j] = Math.min(prev[j]+1, curr[j-1]+1, prev[j-1]+cost);
    }
    var tmp = prev; prev = curr; curr = tmp;
  }
  return prev[n];
}

function matchesGroup(guess, group){
  var g = normalizeGuess(guess);
  if(g.length<2) return false;
  for(var i=0;i<group.length;i++){
    var v = normalizeGuess(group[i]);
    if(g===v) return true;
    if(g.length>=3 && v.indexOf(g)!==-1) return true;
    if(v.length>=3 && g.indexOf(v)!==-1) return true;
    var typoTolerance = v.length<=4 ? 1 : (v.length<=9 ? 2 : 3);
    if(levenshtein(g, v) <= typoTolerance) return true;
  }
  return false;
}

function submitFinale(){
  var cur = state.current, q = cur.q;
  var guesses = [];
  for(var i=0;i<q.need;i++){
    var val = document.getElementById("finaleInput"+i).value.trim();
    if(val===""){
      document.getElementById("finaleErr").textContent = "Fill in all "+q.need+" answers first.";
      return;
    }
    guesses.push(val);
  }
  document.getElementById("finaleErr").textContent = "";
  var usedGroups = q.answers.map(function(){ return false; });
  var results = guesses.map(function(g){
    for(var gi=0; gi<q.answers.length; gi++){
      if(usedGroups[gi]) continue;
      if(matchesGroup(g, q.answers[gi])){ usedGroups[gi]=true; return true; }
    }
    return false;
  });
  var correctCount = results.filter(function(r){return r;}).length;
  var allCorrect = (correctCount === q.need);
  var earnedPts = correctCount*5 + (allCorrect ? 5 : 0);
  state.finale.answered = true;
  state.finale.correctCount = correctCount;
  state.finale.correct = allCorrect;
  state.finale.pts = earnedPts;
  for(var i=0;i<q.need;i++){
    var el = document.getElementById("finaleInput"+i);
    el.disabled = true;
    el.classList.add(results[i] ? "correct" : "wrong");
  }
  document.getElementById("finaleSubmitBtn").disabled = true;
  for(var j=0;j<guesses.length;j++){
    logQuestion("Finale — "+q.name, "Last Call answer #"+(j+1)+" ("+q.topic+")", guesses[j], results[j] ? guesses[j] : "no match found", results[j]);
  }
  var fullList = q.answers.map(function(g){ return g[0]; }).join(", ");
  var head = allCorrect
    ? ("All "+q.need+" correct! +"+earnedPts+" pts (including the 5 pt perfect bonus) 🍻")
    : (correctCount+" of "+q.need+" correct — +"+earnedPts+" pts banked.");
  document.getElementById("qresult").innerHTML =
    '<div class="result-box '+(allCorrect?"right":(correctCount>0?"right":"wrong"))+'">'+head+
      '<div class="fact">Full list: '+fullList+'. '+q.fact+'</div>'+
      (q.breakdown ? ('<div class="finale-breakdown">'+q.breakdown.map(function(line){ return '<div class="breakdown-line">'+line+'</div>'; }).join("")+'</div>') : '')+
    '</div>'+
    '<button class="btn-secondary" style="margin-top:12px;" onclick="goToEnd()">See my tab</button>';
}

function goToEnd(){
  state.screen="end";
  render();
}

function tierResultsString(idx){
  var r = state.rounds[idx];
  var out = "";
  for(var i=0;i<3;i++){
    var a = r.answered[i];
    if(!a){ out += "❌"; continue; }
    var base = a.correct ? (a.viaBonus ? "🌟" : "✅") : "❌";
    out += base + (a.bonusPtsEarned ? "💰" : "");
  }
  return out;
}

function tagline(score){
  if(score>=45) return "Certified Pub Champion 🏆";
  if(score>=28) return "Solid crawl — buy yourself a round 🍻";
  if(score>=12) return "Middle of the pack, no shame in that 🍺";
  return "Rough night — there's always tomorrow's crawl 🙃";
}

function renderEnd(){
  var total = totalScore();
  var q = todaysContent.finale;
  var need = q.need;
  var r1s = tierResultsString(0), r2s = tierResultsString(1), r3s = tierResultsString(2);
  var usedBonusEmoji = (r1s+r2s+r3s).indexOf("🌟")!==-1 || (r1s+r2s+r3s).indexOf("💰")!==-1;
  var legend = usedBonusEmoji ? "\n(🌟 = won a double-points bonus gamble, 💰 = banked a follow-up bonus)" : "";
  var shareText = "🍺 PUB CRAWL — Day #"+dayNumber+"\n"+
    "My tab: "+total+" pts\n"+
    "R1 "+todaysContent.round1.name+" "+r1s+"\n"+
    "R2 "+todaysContent.round2.name+" "+r2s+"\n"+
    "R3 "+todaysContent.round3.name+" "+r3s+"\n"+
    "Last Call ("+q.name+"): "+state.finale.correctCount+"/"+need+" correct — +"+state.finale.pts+" pts\n"+
    tagline(total)+legend;
  app.innerHTML =
    '<div class="receipt">'+
      '<div class="receipt-head">YOUR TAB</div>'+
      '<div class="receipt-sub">PUB CRAWL · DAY #'+dayNumber+'</div>'+
      '<div class="receipt-line"><span>Round 1 ('+todaysContent.round1.name+')</span><span>'+roundPtsEarned(0)+' pts</span></div>'+
      '<div class="receipt-line"><span>Round 2 ('+todaysContent.round2.name+')</span><span>'+roundPtsEarned(1)+' pts</span></div>'+
      '<div class="receipt-line"><span>Round 3 ('+todaysContent.round3.name+')</span><span>'+roundPtsEarned(2)+' pts</span></div>'+
      '<div class="receipt-line"><span>Last Call ('+q.name+') — '+state.finale.correctCount+'/'+need+'</span><span>+'+state.finale.pts+' pts</span></div>'+
      '<div class="receipt-total"><span>TOTAL</span><span>'+total+' pts</span></div>'+
      '<div class="receipt-tag">'+tagline(total)+'</div>'+
      '<div class="receipt-shoutout">🏈 One for the road: shoutout to Nick Chubb, who announced his retirement this week after eight bruising, unforgettable seasons — 7,349 yards, a 5.0 career average, and a whole lot of tacklers who wish they'+"'"+'d taken a different angle. Enjoy retirement, Nick.</div>'+
    '</div>'+
    '<div class="btn-row">'+
      '<button class="btn-secondary" style="flex:1;" onclick="copyTab()">📋 Copy my tab</button>'+
      '<button class="btn-secondary" style="flex:1;" onclick="shareTab()">📤 Share</button>'+
    '</div>'+
    '<div class="copy-flash" id="copyFlash"></div>'+
    '<textarea id="share-fallback" rows="6" readonly>'+shareText+'</textarea>'+
    '<div class="qa-recap">'+
      '<div class="qa-recap-title">📋 Every Question, Reviewed</div>'+
      questionLog.map(function(entry, i){
        var cls = entry.correct ? "right" : "wrong";
        var mark = entry.correct ? "✅" : "❌";
        var answerLine = entry.correct
          ? ("Your answer: "+entry.yourAnswer)
          : ("Your answer: "+entry.yourAnswer+" — correct answer: "+entry.correctAnswer);
        return '<div class="qa-recap-item '+cls+'">'+
            '<div class="qa-recap-q">'+(i+1)+'. '+mark+' <span class="qa-recap-cat">['+entry.category+']</span> '+entry.question+'</div>'+
            '<div class="qa-recap-a">'+answerLine+'</div>'+
          '</div>';
      }).join("")+
    '</div>';
  window._shareText = shareText;
}

function roundPtsEarned(idx){
  var r = state.rounds[idx], s=0;
  Object.keys(r.answered).forEach(function(k){
    if(r.answered[k].correct) s+=r.answered[k].pts;
    s += r.answered[k].bonusPtsEarned || 0;
  });
  return s;
}

function copyTab(){
  var text = window._shareText;
  var flash = document.getElementById("copyFlash");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      flash.textContent = "Copied! Paste it to your crew.";
    }).catch(function(){
      fallbackCopy(flash);
    });
  } else {
    fallbackCopy(flash);
  }
}
function fallbackCopy(flash){
  var ta = document.getElementById("share-fallback");
  ta.select();
  try{ document.execCommand("copy"); flash.textContent = "Copied! Paste it to your crew."; }
  catch(e){ flash.textContent = "Select the text below and copy manually."; }
}
function shareTab(){
  var text = window._shareText;
  if(navigator.share){
    navigator.share({text:text}).catch(function(){});
  } else {
    copyTab();
  }
}

render();
</script>
