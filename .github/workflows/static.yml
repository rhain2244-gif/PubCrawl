};

var CATKEYS = Object.keys(CATEGORIES);

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rng){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(rng()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

var today = new Date();
var dateSeed = today.getFullYear()*10000 + (today.getMonth()+1)*100 + today.getDate();
var rng = mulberry32(dateSeed);
var shuffledCats = seededShuffle(CATKEYS, rng);
var LAUNCH = new Date(2026,7,18);
var dayNumber = Math.max(0, Math.floor((today - LAUNCH)/86400000));

var lineup = {
  round1: shuffledCats[0],
  round2: shuffledCats[1],
  round3: shuffledCats[2],
  finale: shuffledCats[3]
};

var ROUND_DEFS = [
  {cat: lineup.round1, tier:"tierA", points:[2,4,6], label:"Round 1"},
  {cat: lineup.round2, tier:"tierA", points:[2,4,6], label:"Round 2"},
  {cat: lineup.round3, tier:"tierB", points:[3,6,9], label:"Round 3 — last orders get harder"}
];

var state = {
  screen:"start",
  roundIdx:0,
  rounds:[{answered:{}},{answered:{}},{answered:{}}],
  finale:{wager:0, locked:false, answered:false, correct:null, correctCount:0},
  current:null
};

function baseScore(){
  var s=0;
  state.rounds.forEach(function(r){
    Object.keys(r.answered).forEach(function(k){
      var a=r.answered[k];
      if(a.correct) s+=a.pts;
    });
  });
  return s;
}
function totalScore(){
  var s = baseScore();
  if(state.finale.answered){
    s += state.finale.correct ? state.finale.wager : -state.finale.wager;
  }
  return s;
}
function roundComplete(idx){
  return Object.keys(state.rounds[idx].answered).length >= 3;
}

var app = document.getElementById("app");

var pendingValue = null;

function render(){
  if(state.screen==="start") return renderStart();
  if(state.screen==="question") return renderQuestion();
  if(state.screen==="roundEnd") return renderRoundEnd();
  if(state.screen==="finaleIntro") return renderFinaleIntro();
  if(state.screen==="finaleQuestion") return renderFinaleQuestion();
  if(state.screen==="end") return renderEnd();
}

function renderStart(){
  var r1 = CATEGORIES[lineup.round1], r2 = CATEGORIES[lineup.round2], r3 = CATEGORIES[lineup.round3];
  app.innerHTML =
    '<div class="neon-wrap">'+
      '<div class="mugs">🍺 🍻 🍺</div>'+
      '<h1 class="neon-title">PUB CRAWL</h1>'+
      '<div class="tagline">daily pub trivia</div>'+
      '<div class="day-badge">DAY #'+dayNumber+'</div>'+
    '</div>'+
    '<div class="chalkboard">'+
      '<div class="label">Tonight\'s lineup</div>'+
      '<div class="lineup-row"><span>Round 1</span><span>'+r1.icon+' '+r1.name+'</span></div>'+
      '<div class="lineup-row"><span>Round 2</span><span>'+r2.icon+' '+r2.name+'</span></div>'+
      '<div class="lineup-row"><span>Round 3 (harder)</span><span>'+r3.icon+' '+r3.name+'</span></div>'+
      '<div class="rules">'+
        'Each round is one category, <b>3 questions</b> deep. Round 1 &amp; 2 are worth <b>2 / 4 / 6</b> points, Round 3 turns up the difficulty at <b>3 / 6 / 9</b>.<br>'+
        'Then comes <b>Last Call</b> — a mystery category is revealed and you wager any amount of your points, even zero. Get it right, win your wager. Get it wrong, lose it.'+
      '</div>'+
    '</div>'+
    '<button class="btn-tap" onclick="startGame()">Start the crawl 🍻</button>';
}

function startGame(){
  openQuestion(0,0);
}

function openQuestion(roundIdx, qIndex){
  var def = ROUND_DEFS[roundIdx];
  var q = CATEGORIES[def.cat][def.tier][qIndex];
  state.roundIdx = roundIdx;
  state.current = {roundIdx:roundIdx, qIndex:qIndex, q:q, isFinale:false};
  pendingValue = null;
  state.screen="question";
  render();
}

function questionBodyHTML(q, gated){
  var dis = gated ? " disabled" : "";
  if(q.type==="mc"){
    var opts = q.options.map(function(opt,i){
      return '<button class="opt-btn" id="opt'+i+'" onclick="submitMC('+i+')"'+dis+'>'+opt+'</button>';
    }).join("");
    return opts + '<div id="qresult"></div>';
  }
  return '<div class="num-row"><input type="number" id="numAns" placeholder="Your guess"'+dis+'><button class="btn-secondary" id="numSubmitBtn" onclick="submitNum()"'+dis+'>Submit guess</button></div>'+
    '<div id="numErr" class="err"></div><div id="qresult"></div>';
}

function renderQuestion(){
  var cur = state.current;
  var q = cur.q;
  var def = ROUND_DEFS[cur.roundIdx];
  var cat = CATEGORIES[def.cat];
  var r = state.rounds[cur.roundIdx];
  var used = Object.keys(r.answered).map(function(k){ return r.answered[k].value; });
  var remaining = def.points.filter(function(v){ return used.indexOf(v)===-1; });
  var valueButtons = remaining.map(function(v){
    return '<button class="value-btn" id="val'+v+'" onclick="chooseValue('+v+')">'+v+' pts</button>';
  }).join("");
  app.innerHTML =
    '<div class="round-header"><span class="plank">'+def.label+' · Question '+(cur.qIndex+1)+' of 3</span></div>'+
    '<div class="cat-banner"><span class="ic">'+cat.icon+'</span>'+cat.name+'</div>'+
    '<div class="score-strip"><span>Your tab so far</span><span class="val">'+baseScore()+' pts</span></div>'+
    '<div class="ticket">'+
      '<div class="confidence-label">How many points do you want to put on this one?</div>'+
      '<div class="value-row">'+valueButtons+'</div>'+
      '<div id="valueErr" class="err"></div>'+
      '<div class="qtext" style="margin-top:16px;">'+q.q+'</div>'+
      questionBodyHTML(q, true)+
    '</div>';
}

function chooseValue(v){
  pendingValue = v;
  var vb = document.getElementsByClassName("value-btn");
  for(var i=0;i<vb.length;i++){ vb[i].classList.remove("selected"); }
  var chosen = document.getElementById("val"+v);
  if(chosen) chosen.classList.add("selected");
  document.getElementById("valueErr").textContent = "";
  var opts = document.getElementsByClassName("opt-btn");
  for(var j=0;j<opts.length;j++){ opts[j].disabled = false; }
  var numAns = document.getElementById("numAns");
  if(numAns){
    numAns.disabled = false;
    document.getElementById("numSubmitBtn").disabled = false;
  }
}

function factHTML(correct, correctText, fact, ptsNote){
  var cls = correct ? "right" : "wrong";
  var head = correct ? "Correct! 🍻" : ("Not quite — it was "+correctText+".");
  var noteLine = ptsNote ? ('<div style="margin-top:4px; font-weight:700;">'+ptsNote+'</div>') : "";
  return '<div class="result-box '+cls+'">'+head+noteLine+'<div class="fact">'+fact+'</div></div>'+
    '<button class="btn-secondary" style="margin-top:12px;" onclick="afterQuestion()">Continue</button>';
}

function submitMC(i){
  var cur = state.current, q=cur.q;
  if(pendingValue===null){
    document.getElementById("valueErr").textContent = "Choose a point value first.";
    return;
  }
  var correct = (i===q.answer);
  for(var k=0;k<q.options.length;k++){
    var el = document.getElementById("opt"+k);
    el.disabled = true;
    if(k===q.answer) el.classList.add("correct");
    else if(k===i) el.classList.add("wrong");
  }
  recordAnswer(correct);
  var note = correct ? ("+"+pendingValue+" pts banked.") : ("You had "+pendingValue+" pts on this one — no points earned.");
  document.getElementById("qresult").innerHTML = factHTML(correct, q.options[q.answer], q.fact, note);
}

function submitNum(){
  var cur = state.current, q=cur.q;
  if(pendingValue===null){
    document.getElementById("valueErr").textContent = "Choose a point value first.";
    return;
  }
  var val = document.getElementById("numAns").value;
  if(val===""){
    document.getElementById("numErr").textContent = "Enter a guess first.";
    return;
  }
  document.getElementById("numErr").textContent = "";
  var num = parseFloat(val);
  var lee = (q.leeway||0);
  var correct = Math.abs(num - q.answer) <= lee;
  recordAnswer(correct);
  document.getElementById("numAns").disabled = true;
  document.getElementById("numSubmitBtn").disabled = true;
  var note = correct ? ("+"+pendingValue+" pts banked.") : ("You had "+pendingValue+" pts on this one — no points earned.");
  document.getElementById("qresult").innerHTML = factHTML(correct, String(q.answer), q.fact, note);
}

function recordAnswer(correct){
  var cur = state.current;
  var r = state.rounds[cur.roundIdx];
  r.answered[cur.qIndex] = {value:pendingValue, correct:correct, pts:pendingValue};
}

function afterQuestion(){
  var cur = state.current;
  var idx = cur.roundIdx;
  if(roundComplete(idx)){
    state.screen="roundEnd";
    render();
    return;
  }
  var r = state.rounds[idx];
  var nextQ = -1;
  for(var i=0;i<3;i++){ if(!r.answered.hasOwnProperty(i)){ nextQ=i; break; } }
  openQuestion(idx, nextQ);
}

function renderRoundEnd(){
  var def = ROUND_DEFS[state.roundIdx];
  var isLastRound = state.roundIdx===2;
  var nextLabel = isLastRound ? "Head to Last Call →" : ("Continue to "+ROUND_DEFS[state.roundIdx+1].label+" →");
  app.innerHTML =
    '<div class="round-header"><span class="plank">'+def.label+' complete</span></div>'+
    '<div class="chalkboard" style="text-align:center;">'+
      '<div class="label">Running tab</div>'+
      '<div style="font-family:\'Space Mono\'; font-size:32px; color:var(--blue-neon);">'+baseScore()+' pts</div>'+
    '</div>'+
    '<button class="btn-tap" onclick="advanceAfterRound()">'+nextLabel+'</button>';
}

function advanceAfterRound(){
  if(state.roundIdx<2){
    openQuestion(state.roundIdx+1, 0);
  } else {
    state.screen="finaleIntro";
    render();
  }
}

function renderFinaleIntro(){
  var ck = lineup.finale;
  var cat = CATEGORIES[ck];
  var q = cat.finale;
  var total = baseScore();
  app.innerHTML =
    '<div class="finale-badge">🔔 Last Call</div>'+
    '<div class="wager-total">Tonight\'s category is<br><span style="font-family:\'Bungee\'; font-size:26px; color:var(--cream);">'+cat.icon+' '+cat.name+'</span></div>'+
    '<div class="wager-total">You\'re walking in with <b>'+total+' pts</b>. Wager any amount — even zero.</div>'+
    '<div class="wager-total" style="color:var(--tan); font-size:13px;">You\'ll need to name <b>'+q.need+'</b> correct answers. Get all '+q.need+' right to win your wager — fall short on even one, and you lose it all.</div>'+
    '<div class="quick-bets">'+
      '<button class="btn-secondary" onclick="quickBet(0)">No wager</button>'+
      '<button class="btn-secondary" onclick="quickBet(Math.floor('+total+'/2))">Half tab</button>'+
      '<button class="btn-secondary" onclick="quickBet('+total+')">All in</button>'+
    '</div>'+
    '<div class="wager-row"><input type="number" id="wagerInput" min="0" max="'+total+'" value="0"></div>'+
    '<div id="wagerErr" class="err"></div>'+
    '<button class="btn-tap" onclick="lockWager('+total+')">Lock in wager 🔒</button>';
}

function quickBet(v){
  document.getElementById("wagerInput").value = v;
}

function lockWager(total){
  var v = parseInt(document.getElementById("wagerInput").value || "0", 10);
  if(isNaN(v) || v<0 || v>total){
    document.getElementById("wagerErr").textContent = "Wager between 0 and "+total+" pts.";
    return;
  }
  state.finale.wager = v;
  state.screen="finaleQuestion";
  render();
}

function renderFinaleQuestion(){
  var ck = lineup.finale;
  var cat = CATEGORIES[ck];
  var q = cat.finale;
  state.current = {catKey:ck, q:q, isFinale:true};
  var inputs = "";
  for(var i=0;i<q.need;i++){
    inputs += '<input type="text" class="finale-input" id="finaleInput'+i+'" placeholder="Answer '+(i+1)+'">';
  }
  app.innerHTML =
    '<div class="finale-badge">🔔 Last Call</div>'+
    '<div class="ticket">'+
      '<div class="pts-tag">'+cat.icon+' '+cat.name+' · wagered '+state.finale.wager+' pts</div>'+
      '<div class="qtext">'+q.prompt+'</div>'+
      '<div class="finale-inputs">'+inputs+'</div>'+
      '<div id="finaleErr" class="err"></div>'+
      '<button class="btn-tap" id="finaleSubmitBtn" onclick="submitFinale()">Lock in answers 🔒</button>'+
      '<div id="qresult"></div>'+
    '</div>';
}

function normalizeGuess(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9 ]/g,"");
}

function matchesGroup(guess, group){
  var g = normalizeGuess(guess);
  if(g.length<2) return false;
  for(var i=0;i<group.length;i++){
    var v = normalizeGuess(group[i]);
    if(g===v) return true;
    if(g.length>=3 && v.indexOf(g)!==-1) return true;
    if(v.length>=3 && g.indexOf(v)!==-1) return true;
  }
  return false;
}

function submitFinale(){
  var cur = state.current, q = cur.q;
  var guesses = [];
  for(var i=0;i<q.need;i++){
    var val = document.getElementById("finaleInput"+i).value.trim();
    if(val===""){
      document.getElementById("finaleErr").textContent = "Fill in all "+q.need+" answers first.";
      return;
    }
    guesses.push(val);
  }
  document.getElementById("finaleErr").textContent = "";
  var usedGroups = q.answers.map(function(){ return false; });
  var results = guesses.map(function(g){
    for(var gi=0; gi<q.answers.length; gi++){
      if(usedGroups[gi]) continue;
      if(matchesGroup(g, q.answers[gi])){ usedGroups[gi]=true; return true; }
    }
    return false;
  });
  var correctCount = results.filter(function(r){return r;}).length;
  state.finale.answered = true;
  state.finale.correctCount = correctCount;
  state.finale.correct = (correctCount === q.need);
  for(var i=0;i<q.need;i++){
    var el = document.getElementById("finaleInput"+i);
    el.disabled = true;
    el.classList.add(results[i] ? "correct" : "wrong");
  }
  document.getElementById("finaleSubmitBtn").disabled = true;
  var fullList = q.answers.map(function(g){ return g[0]; }).join(", ");
  var head = state.finale.correct
    ? ("All "+q.need+" correct! 🍻")
    : (correctCount+" of "+q.need+" correct — not quite enough to win the wager.");
  document.getElementById("qresult").innerHTML =
    '<div class="result-box '+(state.finale.correct?"right":"wrong")+'">'+head+
      '<div class="fact">Full list: '+fullList+'. '+q.fact+'</div></div>'+
    '<button class="btn-secondary" style="margin-top:12px;" onclick="goToEnd()">See my tab</button>';
}

function goToEnd(){
  state.screen="end";
  render();
}

function tierResultsString(idx){
  var r = state.rounds[idx];
  var out = "";
  for(var i=0;i<3;i++){
    var a = r.answered[i];
    out += (a && a.correct) ? "✅" : "❌";
  }
  return out;
}

function tagline(score){
  if(score>=45) return "Certified Pub Champion 🏆";
  if(score>=28) return "Solid crawl — buy yourself a round 🍻";
  if(score>=12) return "Middle of the pack, no shame in that 🍺";
  return "Rough night — there's always tomorrow's crawl 🙃";
}

function renderEnd(){
  var total = totalScore();
  var ck = lineup.finale;
  var cat = CATEGORIES[ck];
  var need = cat.finale.need;
  var shareText = "🍺 PUB CRAWL — Day #"+dayNumber+"\n"+
    "My tab: "+total+" pts\n"+
    "R1 "+CATEGORIES[lineup.round1].name+" "+tierResultsString(0)+"\n"+
    "R2 "+CATEGORIES[lineup.round2].name+" "+tierResultsString(1)+"\n"+
    "R3 "+CATEGORIES[lineup.round3].name+" "+tierResultsString(2)+"\n"+
    "Last Call ("+cat.name+"): "+state.finale.correctCount+"/"+need+" correct — "+(state.finale.correct?"won":"lost")+" a "+state.finale.wager+"pt wager\n"+
    tagline(total);
  app.innerHTML =
    '<div class="receipt">'+
      '<div class="receipt-head">YOUR TAB</div>'+
      '<div class="receipt-sub">PUB CRAWL · DAY #'+dayNumber+'</div>'+
      '<div class="receipt-line"><span>Round 1 ('+CATEGORIES[lineup.round1].name+')</span><span>'+roundPtsEarned(0)+' pts</span></div>'+
      '<div class="receipt-line"><span>Round 2 ('+CATEGORIES[lineup.round2].name+')</span><span>'+roundPtsEarned(1)+' pts</span></div>'+
      '<div class="receipt-line"><span>Round 3 ('+CATEGORIES[lineup.round3].name+')</span><span>'+roundPtsEarned(2)+' pts</span></div>'+
      '<div class="receipt-line"><span>Last Call ('+cat.name+') — '+state.finale.correctCount+'/'+need+'</span><span>'+(state.finale.correct?"+":"-")+state.finale.wager+' pts</span></div>'+
      '<div class="receipt-total"><span>TOTAL</span><span>'+total+' pts</span></div>'+
      '<div class="receipt-tag">'+tagline(total)+'</div>'+
    '</div>'+
    '<div class="btn-row">'+
      '<button class="btn-secondary" style="flex:1;" onclick="copyTab()">📋 Copy my tab</button>'+
      '<button class="btn-secondary" style="flex:1;" onclick="shareTab()">📤 Share</button>'+
    '</div>'+
    '<div class="copy-flash" id="copyFlash"></div>'+
    '<textarea id="share-fallback" rows="6" readonly>'+shareText+'</textarea>';
  window._shareText = shareText;
}

function roundPtsEarned(idx){
  var r = state.rounds[idx], s=0;
  Object.keys(r.answered).forEach(function(k){ if(r.answered[k].correct) s+=r.answered[k].pts; });
  return s;
}

function copyTab(){
  var text = window._shareText;
  var flash = document.getElementById("copyFlash");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      flash.textContent = "Copied! Paste it to your crew.";
    }).catch(function(){
      fallbackCopy(flash);
    });
  } else {
    fallbackCopy(flash);
  }
}
function fallbackCopy(flash){
  var ta = document.getElementById("share-fallback");
  ta.select();
  try{ document.execCommand("copy"); flash.textContent = "Copied! Paste it to your crew."; }
  catch(e){ flash.textContent = "Select the text below and copy manually."; }
}
function shareTab(){
  var text = window._shareText;
  if(navigator.share){
    navigator.share({text:text}).catch(function(){});
  } else {
    copyTab();
  }
}

render();
</script>
</body>
</html>
