    ],
    finale:{
      prompt:"Name 5 of the 7 Summer Olympics host cities from 2000 to 2024.",
      need:5, total:7,
      answers:[["Sydney"],["Athens"],["Beijing"],["London"],["Rio de Janeiro","Rio"],["Tokyo"],["Paris"]],
      fact:"Tokyo's 2020 Games were delayed a year by the pandemic and actually held in the summer of 2021, still branded \"Tokyo 2020.\""
    }
